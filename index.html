<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Attitude Co·Dancing: salas premium para profes y bailarines en el centro de Barcelona.">
<meta property="og:title" content="Attitude Co·Dancing">
<meta property="og:description" content="El espacio a la altura de tu proyecto.">
<style>html,body{margin:0;background:#000}</style>
<title>Attitude Co·Dancing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  color-scheme: dark;
  --bg:#000000;
  --surface:#110C14;
  --surface-2:#1A1220;
  --line:#2E2236;
  --text:#F5EEF8;
  --muted:#A897B3;
  --purple:#B556D0;
  --purple-deep:#7A2E93;
  --purple-soft:rgba(181,86,208,.16);
  --green:#B556D0;
  --green-soft:rgba(76,187,23,.16);
  --danger:#FF6B7A;
  --display:"Whitney Attitude","Whitney",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Helvetica Attitude","Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  margin:0;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-inline:16px;padding-block:0 48px;min-height:100%;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto}
a{color:var(--purple)}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}


/* intro: golpe con temblor */
.intro{min-height:calc(100svh - 150px);justify-content:center;align-items:center;gap:36px;padding-top:0;animation:none}
.logo-anim{position:relative;width:min(86vw,440px);aspect-ratio:900/567;isolation:isolate}
.logo-anim img{position:absolute;display:block}
.l-att,.l-skool{inset:0;width:100%;height:100%}
.l-co{left:13.24%;width:70.87%;top:75.56%;height:auto;opacity:0}
.l-flash{position:absolute;inset:-25%;pointer-events:none;background:radial-gradient(closest-side,rgba(181,86,208,.8),rgba(181,86,208,0) 70%);opacity:0}
.logo-anim{animation:shake .35s linear 1.6s}
.l-skool{animation:vanish .05s linear 1.6s forwards}
.l-co{animation:slam .38s cubic-bezier(.2,1.2,.4,1) 1.6s both}
.l-flash{animation:flash .6s ease-out 1.6s}
.intro-btn{opacity:0;transform:translateY(10px);animation:btnIn .5s ease 2.5s forwards;font-size:22px;padding:16px 38px;text-transform:uppercase}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-2%,1%) rotate(-1deg)}40%{transform:translate(2%,-1%) rotate(1deg)}60%{transform:translate(-1%,1%)}80%{transform:translate(1%,0)}}
@keyframes vanish{to{opacity:0}}
@keyframes slam{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:none}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@keyframes btnIn{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .logo-anim,.l-skool,.l-co,.l-flash,.intro-btn{animation:none}
  .l-skool,.l-flash{display:none}.l-co,.intro-btn{opacity:1;transform:none}
}


/* explicación */
.pic{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;display:block}
symbol .a{stroke:var(--purple)}
symbol .af{fill:var(--purple);stroke:none}
.about{gap:14px;text-align:center;align-items:center}
.about p{margin-inline:auto;max-width:none}
.about-head{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:18px 14px}
.fit-title{width:100%;display:flex;flex-direction:column;align-items:center;gap:0;line-height:.8;font-size:40px}
.fit-title span{display:block;white-space:nowrap}
.about-head .sub{font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:.01em;font-size:16px;line-height:1.3;color:var(--purple);width:100%}
.oneline{display:inline-block;white-space:nowrap}
.oneline.wrap{white-space:normal;display:inline;text-wrap:balance}
.perk{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px}
.perk .pic.big{width:58px;height:58px;color:var(--text);margin-bottom:4px}
.perk p{color:var(--muted);font-size:15.5px;width:100%}
.howbox{width:100%;padding:22px 0 6px;display:flex;flex-direction:column;align-items:center;gap:18px}
.timeline{list-style:none;margin:0;padding:0;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:relative}
.timeline::before{content:"";position:absolute;top:17px;left:16.66%;right:16.66%;height:2px;background:var(--purple);opacity:.55}
.timeline li{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding-inline:6px}
.dotn{position:relative;width:36px;height:36px;border-radius:50%;background:var(--purple);color:#0B0610;display:grid;place-items:center;
  font-family:var(--display);font-weight:900;font-style:italic;font-size:17px;box-shadow:0 0 0 6px var(--bg)}
.timeline p{font-size:13.5px;line-height:1.35;color:var(--text)}
.limited{margin:0 auto;display:inline-block;font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:16px;letter-spacing:.1em;color:#0B0610;background:var(--text);padding:8px 16px;border-radius:999px}
.about .callout h3{font-size:18px;line-height:1.2;width:100%}
.actions.stack{display:grid;grid-template-columns:1fr 2fr;gap:10px;width:100%}
.actions.stack .btn{width:100%;font-size:15px;padding:12px 10px;text-transform:uppercase}
.actions.stack .btn.ghost{font-size:13px}
.about .callout{width:100%;align-items:center;padding:22px 18px;border-color:var(--text)}
.about .actions{justify-content:center}


/* formulario v2 */
.qlabel{display:flex;gap:10px;align-items:flex-start;text-transform:uppercase;font-size:15px;line-height:1.25;letter-spacing:.01em}
.qn{flex:0 0 auto;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--purple);color:#0B0610;font-size:13px;font-style:italic;margin-top:-2px}
.chips.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:600px){.chips.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.chip.box{border-radius:10px;padding:12px 10px;min-height:60px;display:grid;place-items:center;text-align:center;line-height:1.2;font-size:13px}
.builder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.bl{font-family:var(--display);font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.bl small{font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0;margin-left:6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{appearance:none;cursor:pointer;height:42px;border-radius:8px;border:1px solid var(--line);background:#000;color:var(--text);font-family:var(--display);font-weight:900;font-size:15px}
.day[aria-pressed=true]{background:var(--purple);border-color:var(--purple);color:#0B0610}
.rooms2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.room2{appearance:none;cursor:pointer;text-align:left;font:inherit;color:var(--text);background:#000;border:1.5px solid var(--line);border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;gap:4px}
.room2 .rt{display:flex;align-items:center;gap:7px;white-space:nowrap}
.room2 sup{font-size:.6em;vertical-align:.5em;line-height:0}
.room2 b{font-family:var(--display);font-weight:900;font-size:14px;text-transform:uppercase}
.room2 em{font-style:normal;font-family:var(--display);font-weight:900;font-size:14px;color:var(--purple)}
.room2 small{color:var(--muted);font-size:12.5px;padding-left:31px}
.room2 .sw{width:24px;height:24px;font-size:14px;border-radius:5px}
.room2[aria-pressed=true]{border-color:var(--text);background:var(--surface-2);box-shadow:0 0 0 1px var(--text)}
.room2.any{grid-column:1/-1}
.room2.any .sw{border:1.5px dashed var(--text)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.times label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.times select{background:#000}
.btn.add{font-size:16px;padding:12px}
.flist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.fitem{display:grid;grid-template-columns:30px 1fr 36px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.fitem b{display:block;font-family:var(--display);font-weight:900;font-size:14px;text-transform:uppercase}
.fitem span{font-size:14px;color:var(--muted)}
.fitem .sw{width:30px;height:30px}
.del{appearance:none;cursor:pointer;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#000;color:var(--text);font-size:20px;line-height:1}
.del:hover{border-color:var(--danger);color:var(--danger)}
.alt{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.datebtn{position:relative;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.datebtn:hover{border-color:var(--muted)}
.datebtn span{font-family:var(--display);font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--purple)}
.datebtn b{font-family:var(--display);font-weight:900;font-size:16px}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
select{appearance:auto}
#inicioMes{margin-top:4px}


.fr[data-finde]{border-style:dashed}
.fr[data-finde][aria-pressed=true]{border-style:solid}
.cal{margin-top:8px;background:var(--surface);border:1.5px solid var(--text);border-radius:12px;padding:12px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh b{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:15px}
.cnav{appearance:none;cursor:pointer;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#000;color:var(--text);font-size:22px;line-height:1}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cw{font-size:11px;color:var(--muted);font-weight:700;padding-block:4px}
.cday{appearance:none;cursor:pointer;height:38px;border-radius:8px;border:0;background:transparent;color:var(--text);font:inherit;font-size:15px;font-variant-numeric:tabular-nums}
.cday:hover:not(:disabled){background:var(--surface-2)}
.cday[aria-pressed=true]{background:var(--purple);color:#0B0610;font-weight:700}
.cday:disabled{color:var(--line);cursor:default}
.datebtn[aria-expanded=true]{border-color:var(--text)}
button.datebtn{appearance:none;text-align:left;font:inherit;color:var(--text)}


.room2 .price{padding-left:31px;font-family:var(--display);font-weight:900;font-size:13px;color:var(--text);margin-top:2px}
.room2 .iva{font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--muted);padding-left:0}
.pnote{font-size:13px;color:var(--purple);line-height:1.4;margin:2px 0 4px}


/* ===== móvil ===== */
html{-webkit-text-size-adjust:100%}
button,label,.chip,.day,.room2,.cday{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.chip{min-height:44px}
.chip.box{min-height:64px}
.cday{height:44px}
.day{height:46px}
.room2 .price{white-space:nowrap}
/* barra inferior fija con Atrás / Siguiente */
.nav{position:sticky;bottom:0;z-index:6;margin-inline:-16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,#000 28%);}
.nav .btn{min-height:52px}
.nav .btn.ghost{background:#000}
.nav .btn:not(.ghost){flex:1;max-width:340px}
/* cabecera compacta en el formulario */
body[data-screen="form"] .brand img{height:44px}
body[data-screen="form"] .bar{padding-block:10px 8px;gap:8px 12px}
body[data-screen="form"] .brushbar{top:calc(env(safe-area-inset-top,0px) + 74px)}
@media (max-width:480px){
  .brand img{height:58px}
  .screen{gap:20px}
  h2{font-size:clamp(30px,9vw,44px)}
  .q{gap:12px}
  .qlabel{font-size:14.5px}
  .perk{padding:20px 16px}
  .room2 .iva{display:inline}
}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--text);color:#0B0610;font-family:var(--display);font-weight:900;font-size:14px;padding:10px 18px;border-radius:999px;transition:opacity .2s,transform .2s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px}
.bar .brand{flex-basis:100%;justify-content:center}
.brand{display:flex;align-items:center;line-height:1}
.brand img{height:72px;width:auto;display:block}
.progress{flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--purple);transition:width .35s ease}
.stepcount{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}

/* screens */
.screen{display:flex;flex-direction:column;gap:22px;padding-top:18px;animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.progress i{transition:none}}

.eyebrow{font-size:13px;font-weight:800;font-style:italic;letter-spacing:.16em;text-transform:uppercase;color:var(--purple)}
h1,h2{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;line-height:.92;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(52px,15vw,100px)}
h2{font-size:clamp(34px,9vw,52px)}
h3{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:22px;letter-spacing:-.005em;margin:0;line-height:1.05}
p{margin:0;max-width:62ch}
.lead{font-size:18px;color:var(--text)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* hero */
.hero{position:relative;padding-top:3vh;display:flex;flex-direction:column;gap:22px}
.hero h1 .co{color:var(--purple);display:block}
.hero h1{font-size:clamp(48px,14vw,92px)}
.badge{width:min(58vw,260px);height:auto;display:block;margin-bottom:4px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}

/* buttons */
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:800;font-style:italic;font-size:19px;letter-spacing:0;
  padding:15px 26px;border-radius:var(--r);background:var(--purple);color:#0B0610;transition:transform .12s ease,background .15s}
.btn:hover{background:#C66BE0}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-family:var(--display);font-style:normal;font-size:15px;text-transform:none;letter-spacing:0;font-weight:900;padding:14px 20px}
.btn.ghost:hover{border-color:var(--muted)}
.btn.green{background:var(--green);color:#061103}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;padding:4px}

/* about */
.offer{display:grid;gap:0;border-top:1px solid var(--line)}
.offer div{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;padding-block:18px;border-bottom:1px solid var(--line)}
.offer svg{grid-row:span 2;width:36px;height:36px;color:var(--purple)}
.offer p{color:var(--muted);font-size:15px}
.how{counter-reset:s;display:grid;gap:12px;padding:0;margin:0;list-style:none}
.how li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.how li::before{content:counter(s);font-family:var(--display);font-weight:900;font-style:italic;font-size:26px;color:var(--green);line-height:1}
.callout{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}

/* form */
.q{display:flex;flex-direction:column;gap:10px}
.q > label,.qlabel{font-family:var(--display);font-weight:900;font-size:16px;letter-spacing:.005em}
.req{color:var(--purple)}
.hint{font-size:13px;color:var(--muted);margin-top:-4px}
input[type=text],input[type=email],input[type=tel],textarea,select{
  width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 14px;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--purple)}
textarea{min-height:96px;resize:vertical}
.prefix{position:relative}
.prefix span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.prefix input{padding-left:30px}
.err{color:var(--danger);font-size:13px;min-height:0}
.invalid{border-color:var(--danger)!important}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;cursor:pointer;font:inherit;font-family:var(--display);font-size:14px;font-weight:900;letter-spacing:.01em;color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:9px 15px;transition:all .12s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed=true]{background:var(--purple);border-color:var(--purple);color:#0B0610}

/* years stepper */
.stepper{display:flex;align-items:center;gap:18px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:26px;cursor:pointer;line-height:1}
.stepper button:hover{border-color:var(--purple)}
.years{font-family:var(--display);font-weight:900;font-size:72px;line-height:1;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums;color:var(--purple)}
.years small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}

/* rooms */
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.room{appearance:none;cursor:pointer;text-align:left;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;transition:all .12s}
.room:hover{border-color:var(--muted)}
.room[aria-pressed=true]{border-color:var(--purple);background:var(--purple-soft)}
.room .name{font-family:var(--display);font-weight:900;font-style:italic;font-size:24px;text-transform:uppercase;line-height:1}
.room .m2{font-family:var(--display);font-size:40px;line-height:.9;color:var(--purple)}
.room .m2 em{font-style:normal;font-size:16px;color:var(--muted);margin-left:3px}
.room .cap{font-size:13px;color:var(--muted)}
.plan{height:34px;display:flex;align-items:flex-end}
.plan i{display:block;border:1.5px solid var(--muted);border-radius:2px}
.room[aria-pressed=true] .plan i{border-color:var(--purple)}
.check{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.room[aria-pressed=true] .check{background:var(--green);border-color:var(--green)}
.room[aria-pressed=true] .check::after{content:"";width:9px;height:5px;border-left:2px solid #061103;border-bottom:2px solid #061103;transform:rotate(-45deg) translate(1px,-1px)}

/* franja cards */
.franjas{display:grid;gap:10px}
.fr{appearance:none;cursor:pointer;text-align:left;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.fr:hover{border-color:var(--muted)}
.fr[aria-pressed=true]{border-color:var(--purple);background:var(--purple-soft)}
.fr b{font-family:var(--display);font-weight:900;font-style:italic;font-size:26px;text-transform:uppercase;line-height:1}
.fr span{color:var(--muted);font-size:14px;grid-column:1}
.fr .hrs{grid-row:1/span 2;grid-column:2;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right}

/* grid */
.gridwrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.sched{border-collapse:separate;border-spacing:4px;width:100%;min-width:360px}
.sched th{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.sched th.hr{text-align:right;padding-right:6px;font-variant-numeric:tabular-nums;letter-spacing:0;font-weight:500;white-space:nowrap}
.sched td{padding:0}
.cell{appearance:none;width:100%;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:background .1s}
.cell:hover{border-color:var(--muted)}
.cell[aria-pressed=true]{background:var(--purple);border-color:var(--purple)}
.cell.am[aria-pressed=true]{background:var(--green);border-color:var(--green)}
.cell[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--ink);font-family:var(--display);font-weight:900;font-size:17px;line-height:1}
.cell.any[aria-pressed=true]{background:transparent;border:1.5px dashed var(--text);color:var(--text)}
/* pincel de salas */
.brushbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 114px);z-index:4;background:var(--bg);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;padding-block:8px}
.brush{appearance:none;cursor:pointer;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;font:inherit;color:var(--text);
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:7px 8px;transition:all .12s}
.brush:hover{border-color:var(--muted)}
.brush[aria-checked=true]{border-color:var(--text);background:var(--surface-2);box-shadow:0 0 0 1px var(--text)}
.brush .bt{display:flex;flex-direction:column;line-height:1.2}
.brush b{font-family:var(--display);font-size:14px;font-weight:900}
.brush small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.sw{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--c);color:var(--ink);font-family:var(--display);font-weight:900;font-size:17px;flex:0 0 auto}
.brush.any .sw,.sw[style*="transparent"]{border:1.5px dashed var(--text)}
.sw.sm{width:20px;height:20px;font-size:12px;border-radius:4px;margin-right:6px}
.tsalas{display:flex;flex-wrap:wrap;gap:6px 14px;width:100%}
.sumlist{display:flex;flex-direction:column;gap:6px}
.sumrow{display:flex;align-items:center;font-size:14px}
.blockrow th{padding-top:12px;text-align:left;color:var(--purple);font-family:var(--display);font-weight:900;font-style:italic;font-size:16px;letter-spacing:.06em}
.tally{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tally b{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tally .t{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:2px}

.consent{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;font-size:14px;color:var(--muted)}
.consent input{width:20px;height:20px;accent-color:var(--purple);margin-top:2px}

/* summary */
.sum{display:grid;border-top:1px solid var(--line)}
.sum div{display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);font-size:15px}
.sum dt{color:var(--muted);font-size:13px;letter-spacing:.04em}
.sum dd{margin:0;overflow-wrap:anywhere}
.edit{justify-self:start}

.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:6px}

details.dev{border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;font-size:13px;color:var(--muted)}
details.dev summary{cursor:pointer;font-weight:600;color:var(--text)}
details.dev pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.45;color:var(--muted);max-height:340px;overflow:auto;margin:10px 0 0}

.big-ok{font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(64px,20vw,120px);line-height:.9;color:var(--purple);text-transform:uppercase}
footer{margin-top:40px;font-size:12px;color:var(--muted);text-align:left}
@media (max-width:420px){.rooms{grid-template-columns:1fr}.btn:not(.intro-btn){width:100%}.nav .btn{width:auto}}
</style>

/* ========= CONFIGURACIÓN (editar aquí) ========= */
const WEBHOOK_URL = "";
const PRUEBAS_SIN_DATOS = true; // true = se puede pasar "Preséntate" sin rellenar (solo para revisar). Poner false antes de publicar. // URL del webhook de Make. Vacío = modo borrador (no envía, muestra los datos)

const SALAS = [
  { id:"sala1", n:"1", nombre:"Sala 1", m2:80,  capacidad:"Hasta 15 personas", precio:20, color:"#E6C3F2", ink:"#1A0B20" },
  { id:"sala2", n:"2", nombre:"Sala 2", m2:95,  capacidad:"Hasta 20 personas", precio:30, color:"#B556D0", ink:"#0B0610" },
  { id:"sala3", n:"3", nombre:"Sala 3", m2:125, capacidad:"Unas 40 personas", precio:40, color:"#6E2A86", ink:"#F5EEF8" },
  { id:"sala4", n:"4", nombre:"Sala 4", m2:40,  capacidad:"6–7 personas", precio:10, color:"#FFFFFF", ink:"#0B0610" }
];
const CUALQUIERA = { id:"any", n:"?", nombre:"Cualquier sala", m2:null, capacidad:"La que quede libre", color:"transparent", ink:"#F5EEF8" };
const salaById = id => id==="any" ? CUALQUIERA : SALAS.find(s=>s.id===id);
const salaTxt = id => { const s=salaById(id); return s.m2?`${s.nombre} (${s.m2} m²)`:s.nombre; };
const FLEX_HORARIO = ["Necesito esas horas exactas","Media hora arriba o abajo","Una hora arriba o abajo","Me sirve cualquier franja de mañanas o tardes en el mismo día"];
const FLEX_SALA = ["Sí, me vale otra sala","Solo una más grande","No, necesito esa sala"];
const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DIA_CORTO = {Lunes:"L",Martes:"M","Miércoles":"X",Jueves:"J",Viernes:"V","Sábado":"S",Domingo:"D"};
const RANGO = { manana:[9*60,14*60], tarde:[14*60,22*60], ambas:[9*60,22*60] }; // minutos
const ESTILOS = ["Dancehall","Twerk","Afro","Heels","Sexy Style","Reggaeton","Commercial","Hip Hop","Danza urbana","Jazz","Contemporáneo","Ballet","Bellydance","Salsa / Bachata","K-Pop","Infantil","Otro"];
const MESES = (()=>{ const n=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"]; const out=[]; for(let y=2026,m=9;y<2028;){ out.push(`${n[m]} ${y}`); m++; if(m===12){m=0;y++;} } return out; })();
/* ============================================== */

const state = {
  screen:"welcome", step:0,
  nombre:"", artistico:"", instagram:"", email:"", telefono:"",
  anos:3, estilos:[], estiloOtro:"", alumnos:"", situacion:"",
  franja:"ambas", finde:true, cal:null, franjas:[], draft:{dias:[],sala:"",ini:"",fin:""}, nextId:1,
  flexHorario:"", flexSala:"", salasAlt:[],
  inicio:"", inicioMes:"", tempIni:"", tempFin:"", ensayo:"", comentarios:"", rgpd:false,
  sent:null
};

const FORM_STEPS = ["tu","trayectoria","horario","detalles","resumen"];
const app = document.getElementById("app");
const pad = n => String(n).padStart(2,"0");
const mLabel = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const toMin = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtFecha = iso => { if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${+d} ${["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][+m-1]} ${y}`; };

function go(screen, step){
  state.screen = screen; if(step!==undefined) state.step = step;
  render(); window.scrollTo({top:0,behavior:"instant"});
}
const FINDE = ["Sábado","Domingo"];
const esFinde = d => FINDE.includes(d);
function diasPermitidos(){ return DIAS.filter(d=>esFinde(d)?state.finde:!!state.franja); }
function rangoPara(dias){
  const lab = state.franja ? RANGO[state.franja] : null, fin = RANGO.ambas;
  if(dias.some(d=>!esFinde(d)) && lab) return lab;
  if(dias.length && dias.every(esFinde)) return fin;
  return lab || fin;
}
function rango(){ return rangoPara(state.draft.dias); }
function pruneFranjas(){
  const ok = diasPermitidos();
  state.franjas = state.franjas.map(f=>({...f,dias:f.dias.filter(d=>ok.includes(d))})).filter(f=>{
    if(!f.dias.length) return false; const [a,b]=rangoPara(f.dias.filter(d=>!esFinde(d)).length?f.dias.filter(d=>!esFinde(d)):f.dias);
    return toMin(f.ini)>=a && toMin(f.fin)<=b; });
  state.draft.dias = state.draft.dias.filter(d=>ok.includes(d));
  const [a,b]=rango();
  if(state.draft.ini && (toMin(state.draft.ini)<a||toMin(state.draft.ini)>=b)) state.draft.ini="";
  if(state.draft.fin && (toMin(state.draft.fin)<=a||toMin(state.draft.fin)>b)) state.draft.fin="";
}
function tally(){
  let am=0,pm=0; const porSala={};
  state.franjas.forEach(f=>{
    const i=toMin(f.ini), e=toMin(f.fin), n=f.dias.length;
    const m=Math.max(0,Math.min(e,840)-Math.max(i,540)), t=Math.max(0,Math.min(e,1320)-Math.max(i,840));
    am+=m*n; pm+=t*n; porSala[f.sala]=(porSala[f.sala]||0)+(e-i)*n;
  });
  const h=x=>Math.round(x/6)/10;
  Object.keys(porSala).forEach(k=>porSala[k]=h(porSala[k]));
  return {am:h(am),pm:h(pm),total:h(am+pm),porSala};
}
function diasTxt(dias){ return DIAS.filter(d=>dias.includes(d)).map(d=>d.slice(0,3)).join(" · "); }

const MES_N=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const isoOf=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function calendarHTML(){
  const c=state.calView, y=c.y, m=c.m, first=(new Date(y,m,1).getDay()+6)%7, n=new Date(y,m+1,0).getDate();
  const sel=state[state.cal], min = state.cal==="tempFin" ? state.tempIni : "";
  let cells=""; for(let i=0;i<first;i++) cells+=`<span></span>`;
  for(let d=1;d<=n;d++){ const iso=isoOf(y,m,d), dis = min && iso<=min;
    cells+=`<button type="button" class="cday" data-pick="${iso}" aria-pressed="${iso===sel}" ${dis?"disabled":""}>${d}</button>`; }
  return `<div class="cal" role="dialog" aria-label="Elegir fecha de ${state.cal==="tempIni"?"inicio":"fin"}">
    <div class="calh"><button type="button" class="cnav" data-calnav="-1" aria-label="Mes anterior">‹</button><b>${MES_N[m]} ${y}</b><button type="button" class="cnav" data-calnav="1" aria-label="Mes siguiente">›</button></div>
    <div class="cgrid">${["L","M","X","J","V","S","D"].map(x=>`<span class="cw">${x}</span>`).join("")}${cells}</div>
  </div>`;
}

function cleanIG(v){ return String(v||"").trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/^@/,"").replace(/[/?].*$/,""); }

function done(){
  const demo = !WEBHOOK_URL;
  return `<section class="screen">
    <div class="big-ok">Recibido</div>
    <p class="lead">Gracias${state.nombre?", "+esc(state.nombre.split(" ")[0]):""}. Tu solicitud ya está con nosotros. Cuando tengamos montada la parrilla de la temporada te escribimos${state.email?" a "+esc(state.email):""}.</p>
    ${demo?`<details class="dev" open><summary>Borrador · datos que recibiría Make → Airtable</summary><p style="margin-top:8px">Esta versión no envía nada todavía. Cuando se conecte el webhook, este bloque desaparece.</p><pre>${esc(JSON.stringify(state.sent,null,2))}</pre></details>`:""}
  </section>`;
}

/* ---------- payload ---------- */
function buildPayload(){
  const T = tally();
  const franjas = [];
  state.franjas.forEach(f=>DIAS.filter(d=>f.dias.includes(d)).forEach(dia=>franjas.push({dia,inicio:f.ini,fin:f.fin,horas:(toMin(f.fin)-toMin(f.ini))/60,bloque:toMin(f.ini)<840?(toMin(f.fin)>840?"Mañana y tarde":"Mañana"):"Tarde",sala:salaById(f.sala).nombre})));
  franjas.sort((a,b)=>DIAS.indexOf(a.dia)-DIAS.indexOf(b.dia)||a.inicio.localeCompare(b.inicio));
  return {
    origen:"co-dancing-2627",
    fecha_solicitud:new Date().toISOString(),
    nombre:state.nombre.trim(),
    nombre_artistico:state.artistico.trim(),
    instagram:cleanIG(state.instagram),
    email:state.email.trim().toLowerCase(),
    telefono:state.telefono.trim(),
    anos_experiencia:state.anos,
    estilos:state.estilos.filter(e=>e!=="Otro"),
    estilo_otro:state.estilos.includes("Otro")?state.estiloOtro.trim():"",
    alumnos_por_clase:state.alumnos,
    situacion_actual:state.situacion,
    preferencia_franja:(T.am&&T.pm)?"Mañanas y tardes":T.am?"Mañanas":T.pm?"Tardes":"",
    fines_de_semana:franjas.some(f=>esFinde(f.dia)),
    salas:[...new Set(franjas.map(f=>f.sala))],
    dias:DIAS.filter(d=>franjas.some(f=>f.dia===d)),
    horas_total:T.total, horas_manana:T.am, horas_tarde:T.pm,
    horas_por_sala:Object.fromEntries(Object.entries(T.porSala).map(([id,n])=>[salaById(id).nombre,n])),
    franjas,
    franjas_texto:franjas.map(f=>`${f.dia} ${f.inicio}-${f.fin} · ${f.sala}`).join("\n"),
    flexibilidad_horario:state.flexHorario,
    flexibilidad_sala:state.flexSala,
    salas_alternativas:state.flexSala===FLEX_SALA[0]?state.salasAlt.map(id=>salaById(id).nombre):[],
    inicio_deseado:state.inicio==="Otra"?state.inicioMes:state.inicio,
    temporada_inicio:state.tempIni,
    temporada_fin:state.tempFin,
    interes_ensayo:state.ensayo,
    comentarios:state.comentarios.trim(),
    rgpd:state.rgpd
  };
}

/* ---------- validation ---------- */
function setErr(id,msg){ const el=document.getElementById("e-"+id); if(el) el.textContent=msg||""; const inp=document.getElementById(id); if(inp) inp.classList.toggle("invalid",!!msg); return !msg; }
function validate(key){
  let ok=true;
  if(key==="tu" && !PRUEBAS_SIN_DATOS){
    ok &= setErr("nombre", state.nombre.trim().length<3?"Escribe tu nombre y apellidos.":"");
    ok &= setErr("instagram", cleanIG(state.instagram).length<2?"Necesitamos tu usuario de Instagram para conocer tu trabajo.":"");
    ok &= setErr("email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email.trim())?"":"Revisa el email, parece incompleto.");
    ok &= setErr("telefono", state.telefono.replace(/\D/g,"").length<9?"Escribe un teléfono de al menos 9 cifras.":"");
  }
  if(key==="trayectoria"){
    ok &= setErr("estilos", !state.estilos.length?"Marca al menos un estilo.":(state.estilos.includes("Otro")&&!state.estiloOtro.trim()?"Escribe qué otro estilo enseñas.":""));
    ok &= setErr("alumnos", state.alumnos?"":"Elige una opción.");
    ok &= setErr("situacion", state.situacion?"":"Elige una opción.");
  }
  if(key==="franja") ok &= setErr("franja", (state.franja||state.finde)?"":"Elige al menos una opción.");
  if(key==="horario"){
    { const f=state.draft, falta=[!f.dias.length&&"los días",!f.sala&&"la sala",(!f.ini||!f.fin)&&"el horario"].filter(Boolean);
      ok &= setErr("slots", state.franjas.length?"":(f.dias.length||f.sala||f.ini||f.fin)?`Para añadir tu franja te falta elegir ${falta.join(" y ")}.`:"Añade al menos una franja: elige días, sala y horario."); }
    ok &= setErr("flexHorario", state.flexHorario?"":"Elige una opción.");
    ok &= setErr("flexSala", state.flexSala?"":"Elige una opción.");
    if(state.flexSala===FLEX_SALA[0]) ok &= setErr("salasAlt", state.salasAlt.length?"":"Marca al menos una sala.");
  }
  if(key==="detalles"){
    ok &= setErr("inicio", !state.inicio?"Elige una opción.":(state.inicio==="Otra"&&!state.inicioMes?"Elige el mes.":""));
    ok &= setErr("temporada", !state.tempIni||!state.tempFin?"Elige la fecha de inicio y la de fin.":(state.tempFin<=state.tempIni?"La fecha de fin tiene que ser posterior a la de inicio.":""));
    ok &= setErr("ensayo", state.ensayo?"":"Elige una opción.");
    ok &= setErr("rgpd", state.rgpd?"":"Necesitamos tu permiso para guardar la solicitud.");
  }
  return !!ok;
}

/* ---------- render ---------- */
function render(){
  const bar = document.getElementById("progress"), fill=document.getElementById("progressFill"), sc=document.getElementById("stepcount");
  if(state.screen==="form"){
    const key = FORM_STEPS[state.step];
    document.getElementById("bar").style.visibility="visible"; document.body.dataset.screen="form";
    app.innerHTML = `<section class="screen">${steps[key]()}</section>`;
    bar.hidden=false; fill.style.width = ((state.step+1)/FORM_STEPS.length*100)+"%";
    sc.textContent = `${Math.min(state.step+1,FORM_STEPS.length-1)}/${FORM_STEPS.length-1}`;
    if(key==="horario") updateTally();
  } else {
    bar.hidden = state.screen!=="done"; fill.style.width="100%"; sc.textContent="";
    document.getElementById("bar").style.visibility = state.screen==="welcome" ? "hidden" : "visible"; document.body.dataset.screen=state.screen;
    app.innerHTML = ({welcome,about,nothanks,done})[state.screen]();
    fitTitles();
  }
}
function toast(msg){
  let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1600);
}
function fitTitles(){
  document.querySelectorAll(".fit-title").forEach(h=>{
    const W=h.clientWidth; if(!W) return;
    h.querySelectorAll("span").forEach(sp=>{ sp.style.fontSize="100px"; const w=sp.scrollWidth; sp.style.fontSize=Math.min(160,Math.floor(100*W/w*0.995))+"px"; });
  });
  document.querySelectorAll(".oneline").forEach(sp=>{
    const W=sp.parentElement.clientWidth; if(!W) return;
    sp.classList.remove("wrap"); sp.style.fontSize="16px"; const w=sp.scrollWidth;
    const size=Math.min(20,16*W/w*0.99);
    if(size>=12){ sp.style.fontSize=size.toFixed(2)+"px"; } else { sp.classList.add("wrap"); sp.style.fontSize="15px"; }
  });
}
window.addEventListener("resize",fitTitles);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitTitles);
function updateTally(){
  const T=tally(), el=document.getElementById("tally"); if(!el) return;
  if(!state.franjas.length){ el.hidden=true; return; } el.hidden=false;
  el.innerHTML = `<div class="t"><b>${String(T.total).replace(".",",")}</b> h/semana</div>
    ${state.franja!=="tarde"?`<div class="t">${String(T.am).replace(".",",")} h de mañana</div>`:""}
    ${state.franja!=="manana"?`<div class="t">${String(T.pm).replace(".",",")} h de tarde</div>`:""}`;
}

/* ---------- events ---------- */
app.addEventListener("input", e=>{
  const id=e.target.id;
  if(["nombre","artistico","instagram","email","telefono","estiloOtro","comentarios"].includes(id)){ state[id]=e.target.value; setErr(id,""); }
});
app.addEventListener("change", e=>{
  const t=e.target, id=t.id;
  if(id==="rgpd"){ state.rgpd=t.checked; setErr("rgpd",""); }
  if(id==="dIni"){ state.draft.ini=t.value; if(state.draft.fin && toMin(state.draft.fin)<=toMin(t.value)) state.draft.fin=""; const y=window.scrollY; render(); window.scrollTo(0,y); }
  if(id==="dFin"){ state.draft.fin=t.value; setErr("draft",""); }
  if(id==="inicioMes"){ state.inicioMes=t.value; setErr("inicio",""); }
});

app.addEventListener("click", async e=>{
  const b = e.target.closest("button,[data-go]"); if(!b) return;
  const d = b.dataset;
  if(d.go){ go(d.go, d.go==="form"?0:undefined); return; }
  if("next" in d){
    const key=FORM_STEPS[state.step];
    if(key==="horario"){ const f=state.draft;
      if(f.dias.length && f.sala && f.ini && f.fin){ state.franjas.push({id:state.nextId++,dias:[...f.dias],sala:f.sala,ini:f.ini,fin:f.fin}); state.draft={dias:[],sala:"",ini:"",fin:""}; } }
    if(validate(key)) go("form",state.step+1);
    else { const e=[...document.querySelectorAll(".err")].find(x=>x.textContent); if(e) e.scrollIntoView({behavior:"smooth",block:"center"}); }
    return; }
  if("back" in d){ state.step>0 ? go("form",state.step-1) : go("about"); return; }
  if(d.edit!==undefined){ go("form",+d.edit); return; }
  if(d.anos){ state.anos=Math.max(0,Math.min(30,state.anos+ +d.anos)); document.getElementById("years").innerHTML=`${state.anos}${state.anos>=30?"+":""}<small>${state.anos===1?"año":"años"}</small>`; return; }
  if(d.chip){
    const g=d.chip, v=d.v;
    if(g==="estilos"){
      const i=state.estilos.indexOf(v); i>-1?state.estilos.splice(i,1):state.estilos.push(v);
      b.setAttribute("aria-pressed", state.estilos.includes(v));
      const o=document.getElementById("estiloOtro"); if(o) o.hidden=!state.estilos.includes("Otro");
    } else {
      state[g]=v; b.parentElement.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b));
      if(g==="flexSala"){ const a=document.getElementById("altSalas"); if(a) a.hidden = v!==FLEX_SALA[0]; }
      if(g==="inicio"){ const s=document.getElementById("inicioMes"); if(s) s.hidden = v!=="Otra"; }
    }
    setErr(g,""); return;
  }
  if(d.franja){ state.franja = state.franja===d.franja ? "" : d.franja; pruneFranjas(); document.querySelectorAll(".fr[data-franja]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.franja===state.franja)); setErr("franja",""); return; }
  if("finde" in d){ state.finde=!state.finde; pruneFranjas(); b.setAttribute("aria-pressed",state.finde); setErr("franja",""); return; }
  if(d.dia){ const a=state.draft.dias, i=a.indexOf(d.dia); i>-1?a.splice(i,1):a.push(d.dia); const [ra,rb]=rango(); if(state.draft.ini&&(toMin(state.draft.ini)<ra||toMin(state.draft.ini)>=rb)) state.draft.ini=""; if(state.draft.fin&&(toMin(state.draft.fin)<=ra||toMin(state.draft.fin)>rb)) state.draft.fin=""; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.cal){ if(state.cal===d.cal){ state.cal=null; } else { state.cal=d.cal; const base=state[d.cal]||(d.cal==="tempFin"&&state.tempIni)||"2026-09-01"; const [yy,mm]=base.split("-").map(Number); state.calView={y:yy,m:mm-1}; } const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.calnav){ let {y,m}=state.calView; m+= +d.calnav; if(m<0){m=11;y--;} if(m>11){m=0;y++;} state.calView={y,m}; const sy=window.scrollY; render(); window.scrollTo(0,sy); return; }
  if(d.pick){ state[state.cal]=d.pick; if(state.cal==="tempIni" && state.tempFin && state.tempFin<=d.pick) state.tempFin=""; state.cal=null; setErr("temporada",""); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(d.dsala){ state.draft.sala=d.dsala; b.parentElement.querySelectorAll(".room2").forEach(c=>c.setAttribute("aria-pressed",c===b)); setErr("draft",""); return; }
  if(d.alt){ const a=state.salasAlt, i=a.indexOf(d.alt); i>-1?a.splice(i,1):a.push(d.alt); b.setAttribute("aria-pressed",a.includes(d.alt)); setErr("salasAlt",""); return; }
  if("add" in d){
    const f=state.draft;
    const msg = !f.dias.length?"Marca al menos un día.":!f.sala?"Elige una sala.":(!f.ini||!f.fin)?"Elige la hora de inicio y la de fin.":"";
    if(msg){ setErr("draft",msg); return; }
    state.franjas.push({id:state.nextId++,dias:[...f.dias],sala:f.sala,ini:f.ini,fin:f.fin});
    state.draft={dias:[],sala:f.sala,ini:"",fin:""};
    const y=window.scrollY; render(); window.scrollTo(0,y); toast("Franja añadida"); return;
  }
  if(d.del){ state.franjas=state.franjas.filter(f=>f.id!=+d.del); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if("send" in d){
    const payload = buildPayload(); b.disabled=true; b.textContent="Enviando…";
    if(!WEBHOOK_URL){ state.sent=payload; go("done"); return; }
    try{
      const r = await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      let body=null; try{ body=await r.clone().json(); }catch(_){}
      if(!r.ok || (body && body.ok===false)) throw new Error("fallo");
      state.sent=payload; go("done");
    }catch(err){
      b.disabled=false; b.textContent="Enviar solicitud";
      setErr("send","No se ha podido enviar. Revisa tu conexión y vuelve a intentarlo; si sigue fallando, escríbenos por Instagram a @attitudeskool.");
    }
  }
});

render();
</script>
